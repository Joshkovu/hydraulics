services:
  - type: web
    name: open-channel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: open-channel-db
          property: connectionString

databases:
  - name: open-channel-db
    plan: basic-256mb